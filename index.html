<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Giphy Party</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main>
      <h1>Giphy Party</h1>  
      <div>
          <form id="search-form">
            <input type="text" id="search-input" placeholder="Search for GIFs">
            <button type="submit">Search</button>
          </form>
          <button id="remove-gifs">Remove All GIFs</button>
      </div>
      <p id="gifs-label">... Your GIFs here ...</p>
      <div id="giphy-container"></div>
     
    </main>
    <!-- Axios is already imported here for your convenience -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="index.js"></script>
  </body>
</html>
